<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetPro Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .status-badge {
            display: inline-block;
            background: rgba(76, 175, 80, 0.9);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        .stat-value { font-size: 2.5em; font-weight: bold; color: #667eea; margin: 10px 0; }
        .stat-label { color: #666; font-size: 0.9em; text-transform: uppercase; }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: white;
            color: #667eea;
        }
        .tab-btn:hover { background: rgba(255,255,255,0.3); }
        .tab-content {
            display: none;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .tab-content.active { display: block; }
        .tab-content h2 { margin-bottom: 20px; color: #333; }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn:hover { background: #764ba2; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .pagination {
            display: flex;
            gap: 5px;
            align-items: center;
            margin-left: auto;
        }
        .pagination button {
            padding: 8px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
        }
        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .table-wrapper { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th {
            background: #f5f5f5;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #ddd;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        tr:hover { background: #f9f9f9; }
        .status-badge-cell {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: 600;
        }
        .status-completed {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .status-upcoming {
            background: #fff3e0;
            color: #e65100;
        }
        .status-live {
            background: #ffebee;
            color: #c62828;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            padding: 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
        }
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }
        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #667eea;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .update-time {
            font-size: 0.85em;
            color: #999;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚗 FleetPro Live Dashboard</h1>
            <div class="status-badge">✓ Live & Operational</div>
        </div>

        <!-- Stats -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-label">Total Bookings</div>
                <div class="stat-value" id="totalBookings">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Customers</div>
                <div class="stat-value" id="totalCustomers">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Drivers</div>
                <div class="stat-value" id="totalDrivers">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Vehicles</div>
                <div class="stat-value" id="totalVehicles">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Vendors</div>
                <div class="stat-value" id="totalVendors">-</div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('bookings')">📋 All Bookings</button>
            <button class="tab-btn" onclick="switchTab('history')">📅 Booking History</button>
            <button class="tab-btn" onclick="switchTab('live')">🔴 Live Now</button>
            <button class="tab-btn" onclick="switchTab('vendors')">🏢 Vendors</button>
        </div>

        <!-- Tab: All Bookings -->
        <div id="bookings" class="tab-content active">
            <h2>📋 All Bookings</h2>
            <div class="controls">
                <button class="btn" onclick="loadAllBookings()">🔄 Refresh</button>
                <div class="pagination">
                    <button onclick="prevPageBookings()" id="prevBookings">← Prev</button>
                    <span id="pageInfoBookings">Page 1</span>
                    <button onclick="nextPageBookings()" id="nextBookings">Next →</button>
                </div>
            </div>
            <div id="bookingsError"></div>
            <div class="table-wrapper" id="bookingsTable"></div>
            <div class="update-time" id="bookingsTime"></div>
        </div>

        <!-- Tab: Booking History -->
        <div id="history" class="tab-content">
            <h2>📅 Booking History (Completed)</h2>
            <div class="controls">
                <button class="btn" onclick="loadHistory()">🔄 Refresh</button>
                <div class="pagination">
                    <button onclick="prevPageHistory()" id="prevHistory">← Prev</button>
                    <span id="pageInfoHistory">Page 1</span>
                    <button onclick="nextPageHistory()" id="nextHistory">Next →</button>
                </div>
            </div>
            <div id="historyError"></div>
            <div class="table-wrapper" id="historyTable"></div>
            <div class="update-time" id="historyTime"></div>
        </div>

        <!-- Tab: Live Now -->
        <div id="live" class="tab-content">
            <h2>🔴 Live Rides (Active Now)</h2>
            <div class="controls">
                <button class="btn" onclick="loadLiveRides()">🔄 Refresh</button>
            </div>
            <div id="liveError"></div>
            <div class="table-wrapper" id="liveTable"></div>
            <div class="update-time" id="liveTime"></div>
        </div>

        <!-- Tab: Vendors -->
        <div id="vendors" class="tab-content">
            <h2>🏢 Vendors</h2>
            <div class="controls">
                <button class="btn" onclick="loadVendors()">🔄 Refresh</button>
                <div class="pagination">
                    <button onclick="prevPageVendors()" id="prevVendors">← Prev</button>
                    <span id="pageInfoVendors">Page 1</span>
                    <button onclick="nextPageVendors()" id="nextVendors">Next →</button>
                </div>
            </div>
            <div id="vendorsError"></div>
            <div class="table-wrapper" id="vendorsTable"></div>
            <div class="update-time" id="vendorsTime"></div>
        </div>

        <div class="footer">
            <p>Last Updated: <span id="lastUpdate">--:--:--</span></p>
            <p>FleetPro Dashboard • Real-time Operations</p>
        </div>
    </div>

    <script>
        const API_BASE = 'https://localhost:5050/api';
        let currentPageBookings = 1;
        let currentPageHistory = 1;
        let currentPageVendors = 1;
        const itemsPerPage = 20;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadAllBookings();
            setInterval(loadStats, 30000);
        });

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            if (tabName === 'bookings') loadAllBookings();
            else if (tabName === 'history') loadHistory();
            else if (tabName === 'live') loadLiveRides();
            else if (tabName === 'vendors') loadVendors();
        }

        async function loadStats() {
            try {
                const res = await fetch(`${API_BASE}/demo/stats`, { method: 'GET' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                document.getElementById('totalBookings').textContent = data.bookings || 0;
                document.getElementById('totalCustomers').textContent = data.customers || 0;
                document.getElementById('totalDrivers').textContent = data.drivers || 0;
                document.getElementById('totalVehicles').textContent = data.vehicles || 0;
                document.getElementById('totalVendors').textContent = data.vendors || 0;
                updateTime();
            } catch (err) {
                console.error('Stats load error:', err);
            }
        }

        async function loadAllBookings() {
            try {
                document.getElementById('bookingsError').innerHTML = '';
                const res = await fetch(`${API_BASE}/demo/bookings?page=${currentPageBookings}&limit=${itemsPerPage}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                renderBookingsTable(data.bookings || [], 'bookingsTable');
                document.getElementById('pageInfoBookings').textContent = `Page ${currentPageBookings}`;
                updateTime('bookingsTime');
            } catch (err) {
                document.getElementById('bookingsError').innerHTML = `<div class="error-message">⚠️ Error loading bookings: ${err.message}</div>`;
            }
        }

        async function loadHistory() {
            try {
                document.getElementById('historyError').innerHTML = '';
                const res = await fetch(`${API_BASE}/demo/bookings?page=${currentPageHistory}&limit=${itemsPerPage}&status=completed`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                renderBookingsTable((data.bookings || []).filter(b => b.status === 'completed'), 'historyTable');
                document.getElementById('pageInfoHistory').textContent = `Page ${currentPageHistory}`;
                updateTime('historyTime');
            } catch (err) {
                document.getElementById('historyError').innerHTML = `<div class="error-message">⚠️ Error loading history: ${err.message}</div>`;
            }
        }

        async function loadLiveRides() {
            try {
                document.getElementById('liveError').innerHTML = '';
                const res = await fetch(`${API_BASE}/demo/bookings?limit=100`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const liveRides = (data.bookings || []).filter(b => b.status === 'upcoming').slice(0, 10);
                renderLiveTable(liveRides);
                updateTime('liveTime');
            } catch (err) {
                document.getElementById('liveError').innerHTML = `<div class="error-message">⚠️ Error loading live rides: ${err.message}</div>`;
            }
        }

        async function loadVendors() {
            try {
                document.getElementById('vendorsError').innerHTML = '';
                const res = await fetch(`${API_BASE}/demo/vendors?page=${currentPageVendors}&limit=${itemsPerPage}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                renderVendorsTable(data.vendors || [], 'vendorsTable');
                document.getElementById('pageInfoVendors').textContent = `Page ${currentPageVendors}`;
                updateTime('vendorsTime');
            } catch (err) {
                document.getElementById('vendorsError').innerHTML = `<div class="error-message">⚠️ Error loading vendors: ${err.message}</div>`;
            }
        }

        function renderBookingsTable(bookings, elementId) {
            if (!bookings || bookings.length === 0) {
                document.getElementById(elementId).innerHTML = '<p style="padding: 20px; text-align: center; color: #999;">No bookings found</p>';
                return;
            }
            const html = `
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Customer</th>
                            <th>Driver</th>
                            <th>Vehicle</th>
                            <th>Distance</th>
                            <th>Fare</th>
                            <th>Status</th>
                            <th>Pickup Time</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${bookings.map(b => `
                            <tr>
                                <td>${b._id ? b._id.substring(0, 8) : 'N/A'}</td>
                                <td>${b.customerName || 'Unknown'}</td>
                                <td>${b.driverName || 'Unassigned'}</td>
                                <td>${b.vehicleNo || 'N/A'}</td>
                                <td>${b.estimatedDistance || 0} km</td>
                                <td>₹${b.estimatedFare || 0}</td>
                                <td><span class="status-badge-cell status-${b.status}">${b.status || 'pending'}</span></td>
                                <td>${b.pickupTime || 'N/A'}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            document.getElementById(elementId).innerHTML = html;
        }

        function renderLiveTable(bookings) {
            if (!bookings || bookings.length === 0) {
                document.getElementById('liveTable').innerHTML = '<p style="padding: 20px; text-align: center; color: #999;">No active rides</p>';
                return;
            }
            const html = `
                <table>
                    <thead>
                        <tr>
                            <th>🔴 Status</th>
                            <th>Customer</th>
                            <th>Driver</th>
                            <th>Vehicle</th>
                            <th>Route</th>
                            <th>Distance</th>
                            <th>Fare</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${bookings.map(b => `
                            <tr>
                                <td><span class="status-badge-cell status-live">● LIVE</span></td>
                                <td>${b.customerName || 'Unknown'}</td>
                                <td>${b.driverName || 'N/A'}</td>
                                <td>${b.vehicleNo || 'N/A'}</td>
                                <td>${b.pickupLocation || 'N/A'} → ${b.dropLocation || 'N/A'}</td>
                                <td>${b.estimatedDistance || 0} km</td>
                                <td>₹${b.estimatedFare || 0}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            document.getElementById('liveTable').innerHTML = html;
        }

        function renderVendorsTable(vendors, elementId) {
            if (!vendors || vendors.length === 0) {
                document.getElementById(elementId).innerHTML = '<p style="padding: 20px; text-align: center; color: #999;">No vendors found</p>';
                return;
            }
            const html = `
                <table>
                    <thead>
                        <tr>
                            <th>Vendor Name</th>
                            <th>Status</th>
                            <th>Vehicle Types</th>
                            <th>Service Areas</th>
                            <th>Vehicles</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${vendors.map(v => `
                            <tr>
                                <td>${v.name || 'Unknown'}</td>
                                <td><span class="status-badge-cell status-${v.status}">${v.status || 'inactive'}</span></td>
                                <td>${(v.vendorTypes && v.vendorTypes.length > 0) ? v.vendorTypes.join(', ') : 'Taxi Fleet'}</td>
                                <td>${(v.serviceAreas && v.serviceAreas.length > 0) ? v.serviceAreas.join(', ') : 'Indore'}</td>
                                <td>${v.totalVehicles || 0}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            document.getElementById(elementId).innerHTML = html;
        }

        function prevPageBookings() { if (currentPageBookings > 1) { currentPageBookings--; loadAllBookings(); } }
        function nextPageBookings() { currentPageBookings++; loadAllBookings(); }
        function prevPageHistory() { if (currentPageHistory > 1) { currentPageHistory--; loadHistory(); } }
        function nextPageHistory() { currentPageHistory++; loadHistory(); }
        function prevPageVendors() { if (currentPageVendors > 1) { currentPageVendors--; loadVendors(); } }
        function nextPageVendors() { currentPageVendors++; loadVendors(); }

        function updateTime(elementId = 'lastUpdate') {
            const now = new Date();
            const time = now.toLocaleTimeString();
            document.getElementById(elementId).textContent = time;
        }
    </script>
</body>
</html>
