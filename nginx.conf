# Nginx Production Configuration for FleetPro
# Optimized reverse proxy with security, compression, and caching

# ============================================================================
# GENERAL SETTINGS
# ============================================================================
user nginx;
worker_processes auto;  # Auto-detect CPU count
worker_rlimit_nofile 65535;  # Max file descriptors per worker
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# ============================================================================
# EVENTS
# ============================================================================
events {
    worker_connections 10000;
    use epoll;  # Efficient connection multiplexing
    multi_accept on;  # Accept multiple connections at once
}

# ============================================================================
# HTTP CONFIGURATION
# ============================================================================
http {
    # ========================================================================
    # BASIC SETTINGS
    # ========================================================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with detailed information
    log_format main_extended '$remote_addr - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent" '
                             'rt=$request_time uct="$upstream_connect_time" '
                             'uht="$upstream_header_time" urt="$upstream_response_time"';

    log_format json_combined escape=json
    '{'
        '"timestamp":"$time_iso8601",'
        '"client_ip":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent",'
        '"referer":"$http_referer"'
    '}';

    access_log /var/log/nginx/access.log json_combined buffer=32k flush=5s;

    # ========================================================================
    # PERFORMANCE & BUFFERING
    # ========================================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Timeouts
    client_max_body_size 100M;
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 65;
    send_timeout 10;
    keepalive_requests 100;

    # Buffering
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;
    output_buffers 32 32k;
    postpone_output 1460;

    # ========================================================================
    # GZIP COMPRESSION
    # ========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-font-opentype;
    gzip_min_length 512;
    gzip_disable "msie6";

    # ========================================================================
    # CACHING SETTINGS
    # ========================================================================
    # Cache paths for different content types
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:10m max_size=1g inactive=60d;
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=1h;
    proxy_cache_path /var/cache/nginx/content levels=1:2 keys_zone=content_cache:10m max_size=500m inactive=24h;

    # ========================================================================
    # SECURITY - RATE LIMITING
    # ========================================================================
    # Define rate limiting zones
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_req_status 429;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    limit_conn addr 50;

    # ========================================================================
    # UPSTREAM CONFIGURATION
    # ========================================================================
    # Define backend servers
    upstream fleetpro_backend {
        least_conn;  # Load balancing algorithm

        # Main application server
        server app:5050 max_fails=3 fail_timeout=30s weight=10;

        # Add more servers for load balancing if needed
        # server app2:5050 max_fails=3 fail_timeout=30s weight=10;
        # server app3:5050 max_fails=3 fail_timeout=30s weight=10;

        # Health check settings
        keepalive 32;
        keepalive_timeout 60s;
    }

    # ========================================================================
    # MAIN SERVER BLOCK
    # ========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # ====================================================================
        # HTTP to HTTPS Redirect
        # ====================================================================
        # Redirect all HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }

        # Allow ACME challenges for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Health check endpoint (available on HTTP)
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # ========================================================================
    # HTTPS SERVER BLOCK
    # ========================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # ====================================================================
        # SSL/TLS CONFIGURATION
        # ====================================================================
        # SSL certificates - Update paths to your certificates
        ssl_certificate /etc/nginx/ssl/certs/fleetpro.crt;
        ssl_certificate_key /etc/nginx/ssl/private/fleetpro.key;
        ssl_trusted_certificate /etc/nginx/ssl/certs/ca-bundle.crt;

        # SSL protocols - Modern configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # OCSP stapling for better handshake performance
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_stapling_responder http://ocsp.int-x3.letsencrypt.org/;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # ====================================================================
        # SECURITY HEADERS
        # ====================================================================
        # Strict-Transport-Security (HSTS)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Content Security Policy (CSP)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' fonts.googleapis.com cdnjs.cloudflare.com; font-src 'self' fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'self';" always;

        # X-Frame-Options (Clickjacking protection)
        add_header X-Frame-Options "SAMEORIGIN" always;

        # X-Content-Type-Options
        add_header X-Content-Type-Options "nosniff" always;

        # X-XSS-Protection
        add_header X-XSS-Protection "1; mode=block" always;

        # Referrer-Policy
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Permissions-Policy (formerly Feature-Policy)
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=();" always;

        # ====================================================================
        # LOGGING
        # ====================================================================
        access_log /var/log/nginx/access.log json_combined buffer=32k flush=5s;
        error_log /var/log/nginx/error.log warn;

        # ====================================================================
        # ROOT LOCATION
        # ====================================================================
        root /usr/share/nginx/static;
        index index.html index.htm;

        # ====================================================================
        # STATIC FILES - CACHED (Public assets, images, fonts)
        # ====================================================================
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|eot|otf|ttf|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            gzip on;
            gzip_comp_level 9;

            # Serve cached content
            try_files $uri $uri/ =404;
        }

        # ====================================================================
        # API PROXY - With Caching for GET requests
        # ====================================================================
        location /api/ {
            # Rate limiting for API
            limit_req zone=api_limit burst=20 nodelay;

            # CORS headers
            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
            add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;
            add_header Access-Control-Max-Age "1728000" always;

            # Handle OPTIONS requests
            if ($request_method = 'OPTIONS') {
                return 204;
            }

            # Proxy settings
            proxy_pass http://fleetpro_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;

            # Cache GET requests only
            proxy_cache api_cache;
            proxy_cache_valid 200 5m;
            proxy_cache_valid 404 1m;
            proxy_cache_methods GET HEAD;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_bypass $http_cache_control;
            proxy_no_cache $http_pragma $http_authorization;

            # Add cache status header for debugging
            add_header X-Cache-Status $upstream_cache_status;
            add_header X-Response-Time $upstream_response_time;
        }

        # ====================================================================
        # HEALTH CHECK ENDPOINT
        # ====================================================================
        location /health {
            access_log off;
            proxy_pass http://fleetpro_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }

        # ====================================================================
        # METRICS ENDPOINT (Prometheus)
        # ====================================================================
        location /metrics {
            # Restrict access to localhost/monitoring network only
            allow 127.0.0.1;
            allow 172.28.0.0/16;  # Docker network
            deny all;

            proxy_pass http://fleetpro_backend/metrics;
            access_log off;
        }

        # ====================================================================
        # ADMIN PANEL
        # ====================================================================
        location /admin {
            # Rate limiting for admin
            limit_req zone=login_limit burst=5 nodelay;

            proxy_pass http://fleetpro_backend/admin;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable caching for admin
            proxy_cache_bypass 1;
            proxy_no_cache 1;
        }

        # ====================================================================
        # WEBSOCKET SUPPORT (Socket.io, real-time updates)
        # ====================================================================
        location /socket.io {
            proxy_pass http://fleetpro_backend/socket.io;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # WebSocket timeouts
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ====================================================================
        # SPA FALLBACK (React Router compatibility)
        # ====================================================================
        location / {
            # Rate limiting for general traffic
            limit_req zone=general_limit burst=20 nodelay;

            # Try file, then try directory, then fallback to index.html for SPA routing
            try_files $uri $uri/ /index.html;

            # Cache SPA shell
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
            gzip on;
            gzip_types text/html application/javascript;
        }

        # ====================================================================
        # DENY ACCESS TO SENSITIVE FILES
        # ====================================================================
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ====================================================================
        # CUSTOM ERROR PAGES
        # ====================================================================
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }

    # ========================================================================
    # ADDITIONAL CONFIGURATION FILES
    # ========================================================================
    include /etc/nginx/conf.d/*.conf;
}
