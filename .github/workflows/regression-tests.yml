name: FleetPro Regression Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mongodb:
        image: mongo:5.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            if mongosh --eval "db.adminCommand('ping')" 2>/dev/null; then
              echo "MongoDB is ready"
              exit 0
            fi
            echo "Waiting for MongoDB... ($i/30)"
            sleep 1
          done
          echo "MongoDB failed to start"
          exit 1

      - name: Start FleetPro server
        run: |
          npm run dev > server.log 2>&1 &
          echo $! > server.pid
          sleep 3
          if ! kill -0 $(cat server.pid) 2>/dev/null; then
            echo "Server failed to start"
            cat server.log
            exit 1
          fi

      - name: Run regression tests
        run: npm run test:regression
        env:
          PLAYWRIGHT_BASE_URL: 'http://localhost:5050'
          MONGODB_URI: 'mongodb://localhost:27017/fleetpro'
          NODE_ENV: 'test'

      - name: Stop FleetPro server
        if: always()
        run: kill $(cat server.pid) || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      - name: Upload test videos (on failure)
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: test-videos
          path: test-results/
          retention-days: 7

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Playwright Test Results
          path: 'test-results/results.json'
          reporter: 'java-junit'
          fail-on-error: false

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('test-results/results.json', 'utf8'));

            const passed = results.stats?.expected || 0;
            const failed = results.stats?.unexpected || 0;
            const total = passed + failed;

            const comment = `## Test Results

            - **Total:** ${total}
            - **Passed:** ${passed} ✅
            - **Failed:** ${failed} ❌
            - **Pass Rate:** ${total > 0 ? ((passed/total)*100).toFixed(1) : 0}%

            [View detailed results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  auth-tests:
    runs-on: ubuntu-latest
    needs: regression-tests
    if: always()
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run dev > server.log 2>&1 &
      - run: sleep 3
      - run: npm run test:regression:auth

  admin-tests:
    runs-on: ubuntu-latest
    needs: regression-tests
    if: always()
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run dev > server.log 2>&1 &
      - run: sleep 3
      - run: npm run test:regression:admin

  core-tests:
    runs-on: ubuntu-latest
    needs: regression-tests
    if: always()
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run dev > server.log 2>&1 &
      - run: sleep 3
      - run: npm run test:regression:core

  integrity-tests:
    runs-on: ubuntu-latest
    needs: regression-tests
    if: always()
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run dev > server.log 2>&1 &
      - run: sleep 3
      - run: npm run test:regression:integrity

  isolation-tests:
    runs-on: ubuntu-latest
    needs: regression-tests
    if: always()
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run dev > server.log 2>&1 &
      - run: sleep 3
      - run: npm run test:regression:isolation

  error-tests:
    runs-on: ubuntu-latest
    needs: regression-tests
    if: always()
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run dev > server.log 2>&1 &
      - run: sleep 3
      - run: npm run test:regression:errors

  reports-tests:
    runs-on: ubuntu-latest
    needs: regression-tests
    if: always()
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run dev > server.log 2>&1 &
      - run: sleep 3
      - run: npm run test:regression:reports
