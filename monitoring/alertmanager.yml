global:
  resolve_timeout: 5m
  slack_api_url: '${SLACK_WEBHOOK_URL}'
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

# This root-level `route` block defines how alerts are routed.
route:
  # Default receiver - all alerts go here initially
  receiver: 'default'

  # How long to wait before sending a notification about new alerts
  group_wait: 10s

  # How long to wait before sending notification about new alerts in an existing group
  group_interval: 10s

  # How long to wait before sending notification about resolved alerts
  repeat_interval: 24h

  # Sub-routes for specific alert types
  routes:
    # Critical alerts
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
      group_wait: 0s
      group_interval: 5m
      repeat_interval: 4h

    # Warning alerts
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 5m
      group_interval: 15m
      repeat_interval: 24h

    # Info alerts
    - match:
        severity: info
      receiver: 'info-alerts'
      group_wait: 30m
      group_interval: 1h
      repeat_interval: 7d

# Inhibition rules: when certain alerts are firing, inhibit other alerts
inhibit_rules:
  # Inhibit warning alerts if critical alert already firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'dev_instance']

  # Inhibit info alerts if warning/critical already firing
  - source_match:
      severity: 'warning'
    target_match:
      severity: 'info'
    equal: ['alertname', 'dev_instance']

  # Inhibit all alerts for a service if service is down
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '.+'
    equal: ['service']

receivers:
  # Default receiver
  - name: 'default'
    slack_configs:
      - channel: '#fleetpro-alerts'
        title: 'Alert: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true

  # Critical alerts - send to PagerDuty + Slack
  - name: 'critical-alerts'
    slack_configs:
      - channel: '#fleetpro-critical'
        title: 'CRITICAL: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        color: 'danger'
        send_resolved: true
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SERVICE_KEY}'
        description: '{{ .GroupLabels.alertname }}: {{ (index .Alerts 0).Annotations.summary }}'

  # Warning alerts - Slack only
  - name: 'warning-alerts'
    slack_configs:
      - channel: '#fleetpro-warnings'
        title: 'WARNING: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        color: 'warning'
        send_resolved: true

  # Info alerts - Slack only
  - name: 'info-alerts'
    slack_configs:
      - channel: '#fleetpro-info'
        title: 'INFO: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        color: 'good'
        send_resolved: true
