input {
  # JSON logs from application
  tcp {
    port => 5000
    codec => json
    type => "fleetpro-log"
  }

  # Syslog input (optional)
  syslog {
    port => 5514
    type => "syslog"
  }
}

filter {
  if [type] == "fleetpro-log" {
    # Parse timestamp
    if [timestamp] {
      date {
        match => ["timestamp", "YYYY-MM-dd HH:mm:ss.SSS Z"]
        target => "@timestamp"
      }
    }

    # Extract correlation ID for tracing
    if [correlationId] {
      mutate {
        add_field => { "trace_id" => "%{correlationId}" }
      }
    }

    # Parse error details
    if [error] {
      mutate {
        add_field => { "error_type" => "%{[error][type]}" }
        add_field => { "error_message" => "%{[error][message]}" }
      }
    }

    # Extract metadata
    if [metadata] {
      mutate {
        add_field => { "request_method" => "%{[metadata][method]}" }
        add_field => { "request_path" => "%{[metadata][path]}" }
        add_field => { "response_status" => "%{[metadata][status_code]}" }
        add_field => { "duration_ms" => "%{[metadata][duration_ms]}" }
      }

      # Convert duration to number
      if [duration_ms] {
        mutate {
          convert => { "duration_ms" => "integer" }
        }
      }

      # Convert status to number
      if [response_status] {
        mutate {
          convert => { "response_status" => "integer" }
        }
      }
    }

    # Add severity level
    mutate {
      add_field => { "severity" => "%{level}" }
    }

    # Remove raw message if already parsed
    if [@version] {
      mutate {
        remove_field => ["@version"]
      }
    }
  }

  # GeoIP enrichment (optional)
  if [client_ip] and [type] == "fleetpro-log" {
    geoip {
      source => "client_ip"
      target => "geoip"
    }
  }
}

output {
  # Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "fleetpro-logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
    action => "index"
  }

  # Console output for debugging
  if [@metadata][pipeline] == "debug" {
    stdout {
      codec => json_lines
    }
  }

  # File output (optional)
  # file {
  #   path => "/var/log/logstash/fleetpro-%{+YYYY-MM-dd}.log"
  #   codec => json_lines
  # }
}
